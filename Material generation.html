<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FHD資料生成システム</title>
<style>
:root{--bg:#f4f6f9;--panel:#2c3e50;--box:#34495e;--field:#2c3e50;--accent:#2980b9;--text:#333}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2129;--text:#e5e9ee}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.admin{position:fixed;left:0;top:0;width:400px;height:100vh;background:var(--panel);color:#fff;padding:20px;overflow-y:auto;z-index:100;transition:transform .3s}
.admin.hidden{transform:translateX(-400px)}
.admin h2{margin:0 0 14px;font-size:1.15rem;border-bottom:2px solid var(--box);padding-bottom:10px}
.box{background:var(--box);padding:12px;border-radius:6px;margin-bottom:14px}
.ind{text-align:center;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:8px;margin-bottom:8px}
.btn{flex:1;padding:11px 8px;border:0;border-radius:4px;font-weight:700;cursor:pointer;color:#fff;font-size:.85rem}
.nav{background:#3498db}.nav:disabled{background:#7f8c8d;cursor:not-allowed}
.add{background:#2ecc71}.del{background:#e74c3c}.act{background:#e67e22;width:100%;margin-bottom:8px}.prt{background:#1abc9c;width:100%;font-size:1rem}
.fg{background:var(--box);padding:12px;border-radius:6px;margin-bottom:12px}
.fg label{display:block;margin-bottom:5px;font-size:.8rem;color:#bdc3c7;font-weight:700}
.fg input[type=text],.fg select,.fg textarea{width:100%;padding:9px;border:1px solid #4f5d73;border-radius:4px;background:var(--field);color:#fff;font-size:.9rem;font-family:inherit}
.fg textarea{height:80px;resize:vertical}
.fg input[type=file]{font-size:.8rem;width:100%}
.thumb{display:block;max-width:100%;max-height:70px;margin-top:6px;border-radius:4px}
.dyn{background:#1a252f;padding:12px;border-radius:6px;margin-top:10px;border-left:4px solid #e67e22;position:relative}
.dyn .x{position:absolute;right:8px;top:8px;background:#e74c3c;color:#fff;border:0;border-radius:3px;font-size:.75rem;padding:4px 8px;cursor:pointer}
.tog{position:fixed;left:20px;bottom:20px;z-index:200;background:var(--panel);color:#fff;border:2px solid var(--box);padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:700}
.preview{margin-left:400px;height:100vh;display:flex;align-items:center;justify-content:center;transition:margin-left .3s}
.preview.full{margin-left:0}
.preview{position:relative}
.pnav{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(44,62,80,.92);color:#fff;padding:6px 14px;border-radius:30px;z-index:50;font-weight:700}
.pnav button{background:#3498db;color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:1rem;cursor:pointer}
.pnav button:disabled{opacity:.4;cursor:not-allowed}
#frame{position:relative}
/* --- スライド (1920x1080) --- */
.slide{width:1920px;height:1080px;background:#fff;color:#2c3e50;padding:80px 100px 110px;position:relative;display:flex;flex-direction:column;overflow:hidden;transform-origin:top left;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.s-head{border-left:12px solid #2980b9;padding-left:30px;margin-bottom:40px}
.s-title{font-size:68px;font-weight:700;margin:0;line-height:1.2}
.s-sub{font-size:30px;color:#7f8c8d;margin-top:10px}
.s-body{display:flex;gap:56px;flex:1;min-height:0}
.s-body.l-image{flex-direction:row-reverse}
.s-text{flex:1 1 0%;display:flex;flex-direction:column;gap:26px;overflow:hidden}
.s-text.wide{columns:2;column-gap:56px;display:block}
.s-text.wide .sec{break-inside:avoid;margin-bottom:26px}
.sec h3{font-size:var(--fh,34px);color:var(--hc,#2980b9);margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
.sec p{font-size:var(--fp,28px);line-height:1.5;color:var(--tc,#4a5568);font-weight:var(--fw,400);margin:0;white-space:pre-wrap}
.s-imgs{flex:var(--imf,1) 1 0%;display:flex;flex-direction:column;gap:24px;min-height:0}
.ph{flex:1;background:#f8f9fa;border:3px dashed #e2e8f0;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#a0aec0;font-size:26px;min-height:0}
.ph img{width:100%;height:100%;object-fit:cover}
.ph video{width:100%;height:100%;object-fit:cover}
.ph iframe{width:100%;height:100%;border:0}
.ytp{width:100%;height:100%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;line-height:1.7}
.ytb{font-size:.75rem;background:#1a252f;padding:6px;border-radius:4px;margin-top:6px}
.s-row{display:flex;gap:24px;flex:1;min-height:0}
.s-stack{display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;width:100%}
.s-blk{display:flex;gap:40px;flex:1 1 0;min-height:0}
.s-blk.l-image{flex-direction:row-reverse}
.s-grp{display:flex;flex-direction:column;gap:16px;flex:1 1 0;min-height:0;min-width:0}
.s-grp>.s-row{flex:1;min-height:0}
.s-grp>.s-text{flex:none;overflow:visible}
.s-grp.r{flex-direction:row;gap:40px;container-type:size}
.s-grp.r>.s-row.sq{flex:0 0 min(62cqw,calc(var(--n)*100cqh + (var(--n) - 1)*24px))}
.s-grp.r>.s-row:not(.sq){flex:0 0 58%}
.s-grp.r>.s-text{flex:1 1 0%;overflow:hidden}
.s-cell.rt{flex-direction:row;align-items:center;gap:16px}
.s-cell.rt .s-cap2{flex:1;min-width:0;text-align:left}
.s-row:not(.sq)>.s-cell.rt{flex:1 1 0}
.s-row:not(.sq)>.s-cell.rt .ph{flex:0 0 56%;height:100%}
.s-row.sq>.s-cell.rt{flex:1 1 0;width:auto}
.s-row.sq>.s-cell.rt .ph{flex:none;width:auto;aspect-ratio:1/1;height:min(100cqh,calc(0.58*(100cqw - 24px*(var(--n) - 1))/var(--n)))}
.s-imgs.sq.h{flex-direction:row;justify-content:space-between}
.s-imgs.fh{flex-direction:row}
.s-imgs.fh>.ph{min-width:0}
.s-imgs.sq.h>.ph{flex:none;aspect-ratio:1/1;width:min(100cqh,calc((100cqw - 24px*(var(--n) - 1))/var(--n)))}
.s-cap{font-size:var(--fc,26px);line-height:1.5;color:var(--tc,#4a5568);font-weight:var(--fw,400);white-space:pre-wrap;flex:none}
.s-cell{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.s-cell .ph{flex:1}
.s-cap2{font-size:var(--fc2,24px);line-height:1.4;color:var(--tc,#4a5568);font-weight:var(--fw,400);text-align:center;white-space:pre-wrap;flex:none}
.ph.has{border:2px solid #e2e8f0;background:none}
.s-row.sq{container-type:size;align-items:center;justify-content:space-between;--cap:0px}
.s-row.sq.cp{--cap:46px}
.s-row.sq>.ph{flex:none;aspect-ratio:1/1;width:min(100cqh,calc((100cqw - 24px*(var(--n) - 1))/var(--n)))}
.s-row.sq>.s-cell{flex:none;width:min(calc(100cqh - var(--cap)),calc((100cqw - 24px*(var(--n) - 1))/var(--n)))}
.s-row.sq>.s-cell .ph{flex:none;width:100%;aspect-ratio:1/1}
.s-imgs.sq{container-type:size;align-items:center;justify-content:space-evenly}
.s-imgs.sq>.ph{flex:none;aspect-ratio:1/1;width:min(100cqw,calc((100cqh - 24px*(var(--n) - 1))/var(--n)))}
.s-foot{position:absolute;left:0;right:0;bottom:0;height:76px;padding:0 100px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dyn input[type=text],.dyn textarea{width:100%;padding:9px;border:1px solid #4f5d73;border-radius:4px;background:var(--field);color:#fff;font-size:.9rem;font-family:inherit}
.dyn textarea{height:70px;resize:vertical}
.dyn label{display:block;font-size:.8rem;color:#e67e22;font-weight:700;margin:6px 0 4px}
.chat{position:absolute;right:100px;bottom:100px;width:560px;height:640px;background:#fff;border:2px solid #dcdde1;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.c-head{background:#2980b9;color:#fff;padding:20px 24px;font-size:28px;font-weight:700}
.c-msgs{flex:1;padding:20px;overflow-y:auto;background:#f5f6fa;display:flex;flex-direction:column;gap:14px;font-size:24px}
.cm{padding:14px 20px;border-radius:26px;max-width:82%;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.cm.bot{background:#dcdde1;color:#2f3640;align-self:flex-start;border-top-left-radius:0}
.cm.user{background:#2980b9;color:#fff;align-self:flex-end;border-top-right-radius:0}
.c-in{display:flex;border-top:2px solid #dcdde1;background:#fff}
.c-in input{flex:1;border:0;padding:20px;font-size:24px;outline:0;font-family:inherit;min-width:0}
.c-in button{background:#2980b9;color:#fff;border:0;padding:0 30px;font-size:24px;cursor:pointer}
.c-head{display:flex;justify-content:space-between;align-items:center}
.c-x{background:none;border:0;color:#fff;font-size:36px;line-height:1;cursor:pointer;padding:0 6px}
.fab{position:absolute;right:20px;bottom:8px;width:60px;height:60px;border-radius:50%;border:0;padding:0;background:#fff;color:#fff;font-size:30px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:5;display:none;align-items:center;justify-content:center}
.s-banner{position:relative;margin:-80px -100px 20px;overflow:hidden;flex:none}
.s-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.s-head.cmp{margin-bottom:28px}
.s-head.cmp .s-title{font-size:56px}
.s-head.cmp .s-sub{font-size:26px}
.s-bt{position:absolute;left:69px;bottom:18px;max-width:940px}
.s-bt .s-title{font-size:56px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-bt .s-sub{font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwarn{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:700;z-index:50;display:none}
.fab img{width:62%;height:auto;display:block}
.zm{display:none}
@media (max-width:900px){
 .admin{width:100%;height:100vh;height:100dvh;padding:16px 14px 100px}
 .admin.hidden{transform:translateX(-100%)}
 .fg input[type=text],.fg select,.fg textarea,.dyn input[type=text],.dyn textarea{font-size:16px}
 .preview,.preview.full{margin-left:0;position:fixed;inset:0;display:block;overflow:auto;padding:64px 8px 90px;height:auto;-webkit-overflow-scrolling:touch;background:#e9edf2}
 #frame{margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.2);border:6px solid #2c3e50;box-sizing:content-box}
 .pnav{position:fixed;top:8px;bottom:auto;gap:10px}
 .pnav button{width:44px;height:44px;font-size:1.1rem}
 .zm{display:inline-block}
 .pwarn{position:fixed;top:64px;font-size:12px;max-width:92%;text-align:center}
 .tog{left:50%;bottom:14px;transform:translateX(-50%);padding:14px 22px;font-size:15px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
}
#printArea{display:none}
@media print{
 @page{size:1920px 1080px;margin:0}
 body{height:auto;overflow:visible;background:#fff}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 #printArea .slide{transform:none!important;box-shadow:none;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<button class="tog" id="tog" onclick="togglePanel()">👁️ 画面表示切替</button>

<div class="admin" id="admin">
 <h2>🛠️ FHD資料生成システム</h2>
 <div class="box">
  <div class="ind" id="ind"></div><div id="warnBox"></div>
  <div class="row"><button class="btn nav" id="prev" onclick="go(-1)">◀ 前へ</button><button class="btn nav" id="next" onclick="go(1)">次へ ▶</button></div>
  <div class="row"><button class="btn add" onclick="addPage()">＋ ページ追加</button><button class="btn del" onclick="delPage()">🗑️ 削除</button></div>
  <div class="row"><button class="btn add" style="background:#16a085" onclick="addCont()">＋ 続きのページ(タイトルなし)</button></div>
  <div class="row"><button class="btn nav" id="mvPrev" onclick="movePage(-1)">◀ このページを前へ</button><button class="btn nav" id="mvNext" onclick="movePage(1)">このページを後ろへ ▶</button></div>
  <div id="addLayoutBox"></div>
  <button class="btn nav" style="width:100%;margin-bottom:8px" onclick="checkAll(true)">🔍 全ページの収まりチェック</button>
  <button class="btn prt" onclick="printAll()">📄 全頁を一括PDF出力 (1920×1080)</button>
  <div class="row" style="margin:10px 0 0"><button class="btn act" style="margin:0" onclick="saveJSON()">💾 データ保存(JSON)</button></div>
  <div class="row" style="margin:0"><button class="btn act" style="margin:0" onclick="pickJSON('replace')">📂 JSON読込(置換)</button><button class="btn act" style="margin:0" onclick="pickJSON('append')">＋ JSON追加読込</button></div>
  <input type="file" id="jsonIn" accept=".json,application/json" hidden>
  <div id="chkBox" style="font-size:.8rem;color:#ff9f9f;margin-top:6px;line-height:1.5"></div>
  <div id="msg" style="font-size:.8rem;color:#f1c40f;min-height:1.2em"></div>
 </div>
 <div id="form"></div>
</div>

const newPage=()=>({layout:'l-text',title:'タイトルを入力',subtitle:'サブタイトル',fl:'株式会社　大王製作所',fr:'',chat:true,imgs:['','','','',''],n:3,shape:'fit',ts:'auto',tc:'#4a5568',hc:'#2980b9',tb:false,nh:false,tp:'none',ni:1,dir:'v',blocks:[],items:[{h:'概要',t:'ここに説明文を入力します。'}]});
const mediaTag=(s,th)=>{
 if(s.startsWith('yt:')){const id=s.slice(3);
  if(th)return `<div class="thumb ytb">▶ YouTube動画 (${id})</div>`;
  if(window._pr)return `<div class="ytp">▶ YouTube動画<br>https://youtu.be/${id}</div>`;
  return `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`}
 return /^data:video/.test(s)?`<video src="${s}" ${th?'class="thumb" muted':'autoplay muted loop playsinline'}></video>`:`<img src="${s}"${th?' class="thumb"':''}>`};
const ytId=u=>{const m=String(u).trim().match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);return m?'yt:'+m[1]:''};
function setYT(k,v){if(!v.trim())return;const y=ytId(v);if(!y){alert('YouTubeのURLを認識できません');return}pages[cur].imgs[k]=y;renderForm();renderSlide()}
function setBYT(i,k,v){if(!v.trim())return;const y=ytId(v);if(!y){alert('YouTubeのURLを認識できません');return}pages[cur].blocks[i].imgs[k]=y;renderForm();renderSlide()}
function samplePages(){
 const uri=s=>'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(s)));
 const T=(x,y,t,s,c)=>`<text x='${x}' y='${y}' font-size='${s||30}' font-weight='700' fill='${c||'#2c3e50'}' text-anchor='middle' font-family='sans-serif'>${t}</text>`;

 const C=['#00aeef','#ec008c','#f5d800','#222'];
 const uv=(w,h)=>{const x=w/2;return sv(w,h,`<rect x='${x-150}' y='${h*.1}' width='300' height='70' rx='12' fill='#34495e'/>`+C.map((c,i)=>`<circle cx='${x-105+i*70}' cy='${h*.1+95}' r='11' fill='${c}'/><circle cx='${x-105+i*70}' cy='${h*.1+150}' r='8' fill='${c}'/>`).join('')+`<rect x='${x+170}' y='${h*.1+10}' width='110' height='50' rx='10' fill='#8e44ad'/><polygon points='${x+180},${h*.1+60} ${x+270},${h*.1+60} ${x+330},${h*.62} ${x+130},${h*.62}' fill='#c39bd3' opacity='.45'/><rect x='${x-260}' y='${h*.62}' width='520' height='40' rx='8' fill='#cfd8dc'/>`+C.map((c,i)=>`<rect x='${x-200+i*80}' y='${h*.62-10}' width='60' height='10' fill='${c}'/>`).join('')+T(x,h*.9,'UVインクジェット',36))};
 const roll=(w,h,t,a,b,c)=>{const x=w/2,r1=h*.14,r2=h*.17,r3=h*.14,cy=h*.3,ly=cy+r2,c3=ly+r3;
  const L=(px,py,q,an)=>`<text x='${px}' y='${py}' font-size='22' fill='#37474f' text-anchor='${an}' font-family='sans-serif'>${q}</text>`;
  return sv(w,h,`<circle cx='${x-130}' cy='${cy}' r='${r1}' fill='#b0bec5'/><circle cx='${x+40}' cy='${cy}' r='${r2}' fill='#90a4ae'/><circle cx='${x+40}' cy='${c3}' r='${r3}' fill='#b0bec5'/><path d='M${x-330} ${ly}H${x+330}' stroke='#ec008c' stroke-width='6' stroke-dasharray='14 8'/>`+L(x-130-r1-14,cy+8,a,'end')+L(x+40+r2+14,cy+8,b,'start')+L(x+40+r3+14,c3+8,c,'start')+T(x,h*.93,t,32))};
 const ov=(w,h)=>{const x=w/2,N=['UVインクジェット','オフセット/オンデマンド','シルク印刷','パッド印刷','転写'],K=['#00aeef','#ec008c','#f5a800','#8e44ad','#ff6142'];return sv(w,h,N.map((n,i)=>`<rect x='${x-270}' y='${h*.08+i*h*.17}' width='540' height='${h*.13}' rx='16' fill='#fff' stroke='${K[i]}' stroke-width='4'/><rect x='${x-270}' y='${h*.08+i*h*.17}' width='22' height='${h*.13}' rx='10' fill='${K[i]}'/>`+T(x+10,h*.08+i*h*.17+h*.13*.66,n,30)).join(''))};
 const silk=(w,h)=>{const x=w/2;return sv(w,h,`<rect x='${x-200}' y='${h*.22}' width='400' height='${h*.42}' fill='url(#m)' opacity='.7'/><rect x='${x-200}' y='${h*.22}' width='400' height='${h*.42}' fill='none' stroke='#455a64' stroke-width='16'/><ellipse cx='${x-90}' cy='${h*.38}' rx='70' ry='16' fill='#2c3e50'/><rect x='${x-60}' y='${h*.1}' width='140' height='30' rx='6' fill='#e67e22' transform='rotate(-18 ${x} ${h*.2})'/><rect x='${x-260}' y='${h*.72}' width='520' height='30' rx='6' fill='#cfd8dc'/>`+T(x,h*.92,'シルク印刷',36))};
 const pad=(w,h)=>{const x=w/2;return sv(w,h,`<rect x='${x-40}' y='${h*.06}' width='80' height='50' rx='8' fill='#607d8b'/><path d='M${x-100} ${h*.38}Q${x} ${h*.12} ${x+100} ${h*.38}Z' fill='#fce4ec' stroke='#e91e63' stroke-width='6'/><circle cx='${x}' cy='${h*.7}' r='86' fill='#cfd8dc'/><circle cx='${x}' cy='${h*.6}' r='22' fill='#e91e63'/><rect x='${x-250}' y='${h*.8}' width='500' height='26' rx='6' fill='#b0bec5'/>`+T(x,h*.95,'パッド印刷',34))};
 const trf=(k,w,h)=>{const x=w/2,L=['水転写','熱転写','昇華転写'][k];let b='';
  if(k==0)b=`<path d='M0 ${h*.62}q${w/8} -18 ${w/4} 0t${w/4} 0t${w/4} 0t${w/4} 0V${h}H0Z' fill='#4fc3f7'/><rect x='${x-80}' y='${h*.42}' width='160' height='90' rx='6' fill='#fff' stroke='#90a4ae' stroke-width='3'/><circle cx='${x}' cy='${h*.42+45}' r='24' fill='#ff6142'/>`;
  else if(k==1)b=`<rect x='${x-110}' y='${h*.58}' width='220' height='70' rx='8' fill='#cfd8dc'/><circle cx='${x}' cy='${h*.58+35}' r='22' fill='#ff6142'/><polygon points='${x-100},${h*.5} ${x+100},${h*.5} ${x+130},${h*.35} ${x-60},${h*.35}' fill='#455a64'/>`;
  else b=[-60,0,60].map(d=>`<path d='M${x+d} ${h*.22}q14 20 0 40t0 40' stroke='#ff6142' stroke-width='6' fill='none'/>`).join('')+`<rect x='${x-110}' y='${h*.62}' width='220' height='70' rx='8' fill='#eceff1'/>`+[-60,0,60].map(d=>`<circle cx='${x+d}' cy='${h*.62+35}' r='14' fill='#ff6142'/>`).join('');
  return sv(w,h,b+T(x,h*.93,L,32))};

const chat={title:'ご質問チャット',greet:'ご質問をどうぞ。例:「パッド印刷でにじむ原因は?」「UVインクジェットの欠点は?」',fallback:'申し訳ありません、該当する情報が見つかりませんでした。',faq:[{k:'',a:''}],kb:"1. UVインクジェット\n\n• 概要: インクを微細な滴にして素材へ直接吹き付け、紫外線（UV）で硬化させる印刷技術です。\n• メリット: 製版代がかからず、写真やグラデーションも鮮明に再現できます。白インクの下地で透明素材や濃色素材にも印刷でき、乾燥が不要なので短納期です。\n• デメリット: 蛍光色・金・銀などの特殊印刷はできません。CMYKで表現するためDICやPANTONEの色指定はできません。素材によっては密着が悪く、印刷物の高さが不揃いだと濃淡差が出たりヘッドを擦る恐れがあります（隙間は2mm以内）。\n• 工程: ①Illustratorで印刷データを作成しPDF保存 ②専用ソフト（VersaWorks）でPDFを読み込む ③印刷用治具を設置して材料を配置 ④印刷。材料の位置とデータの位置が違うと印刷ズレが生じます。\n• プライマー処理: UVインクと素材の密着を高める無色透明の下地剤で、より多くの素材に印刷できるようになります。\n• グロス印刷: 透明グロスインクを厚盛りして質感を表現します。\n• 裏刷り: 透明素材に裏から刷る場合はデザインを反転し、印刷順はCMYKの後に白です。不透明素材は白の後にCMYKで、反転しません。外注するときは裏刷りの指示が必要です。\n• 印字スピード: ローランドDGのLEF-200（最大508×330mm）で、CMYKは高品質10分15秒・標準7分20秒、白は高品質26分54秒・標準7分20秒です。乾燥が不要なので、乾燥に3〜8時間かかるシルク印刷やパッド印刷より短納期です。\n• 機種の特長: ローランドDGは軟質から硬質まで素材の対応が広く画質重視、ミマキは大量印刷向けで大容量インクなどコスト面に強みがあります。\n\n2. オフセット印刷・オンデマンド印刷\n\n• 概要: どちらも紙へのフルカラー印刷の代表的な手法です。オフセットは金属プレートのフルカラー印刷にも使われますが、オンデマンドは紙のみです。\n• オフセット印刷: C・M・Y・Kごとに版を作り、1色ずつ印刷します（通常4回）。DICなどの特色に対応し、仕上がりがきれいです。初期費用がかかりますが、大量印刷（目安500枚以上）で採算が良くなります。\n• オンデマンド印刷: レーザープリンターで版が不要です。パソコンから直接印刷でき、少量（目安500枚未満）で採算が良くなります。名刺や台紙に使います。\n• 印刷後の裁断: 裁断機で余分な部分を切り落とすため、トンボ（切り取りの位置決めマーク）を一緒に印刷します。\n• 金属プレート: 金属板に面付けして印刷した後、形状を抜いて加工します。ほとんどがステンレスで、金メッキで仕上げる場合は印刷後にメッキ加工をします。\n\n3. シルク印刷\n\n• 概要: スクリーンとよぶ版の小さな穴からインクを通して印刷します。もともと絹を使っていたため、シルク印刷（シルクスクリーン印刷）とよびます。\n• 特長: インクが厚く乗ります。基本は平面への印刷のみで、色ごとに版が必要です。メッシュが細かいほど細かい絵柄を再現できますが、目詰まりしやすくなります。\n• 工程: 1 フィルムを作成して製版（デザインは黒1色） 2 インク調合 3 商品をセットして位置調整 4 版にインクを乗せ、スキージで印刷 5 乾燥 6 完成。\n• 乾燥: 金属平面は80〜100度で約40分の蒸発乾燥、樹脂や布は2液タイプのインクで約1日の自然乾燥です。\n• 製版の仕組み: 黒のデザイン以外に光が当たり感光膜が硬化します。硬化しない部分を洗い流すとメッシュに戻り、その部分だけインクが通ります。\n\n4. パッド印刷\n\n• 概要: シリコーン製のパッドでインクを転写する印刷です。プラスチック・ガラス・金属・セラミックなど幅広い素材の、平らでない面にも印刷できます。\n• 特長: 二次曲面・三次曲面や凹凸のある製品にも印刷できます。膜厚はシルクの約1/5（2〜5μ）と薄いため下地色の影響を受けやすく、ベタ面は斑が出やすくなります。色ごとに版が必要です。\n• 工程: 1 フィルムを作成して製版（鉄版・樹脂版） 2 インク調合 3 商品をセットして位置調整 4 凹版にインクを入れ、掻き取って凹部だけに残す 5 パッドを凹版に押し当ててインクを移す 6 パッドを商品に押し当てて転写 7 乾燥 8 完成。\n• 乾燥: 熱で乾燥する場合は80〜100度で約40分です。温度が高すぎると本体にクラックが入ります。2液タイプのインクは約1日の自然乾燥です。\n• 欠け: 印刷パターンの一部にインクがつかない状態です。溶剤を添加する、機械のスピードを上げる、パッド表面の油分を取る、溶剤の乾燥速度を遅くするなどで対処します。\n• にじみ: 線が太くなり輪郭がはっきりしない状態です。原因は、溶剤が多すぎる、溶剤の乾燥速度が遅い、版のエッチングが深すぎることです。\n• ひげ: 印刷パターンの周辺にインクが糸状に散る状態です。溶剤を増やす、腰切れ剤（Care39など）を添加する、機械のスピードを遅くするなどで対処します。\n• ピンホール: インク上の小さな気泡です。原因は、インクの粘度が低いこと（溶剤添加量を減らす）、または装置の問題です。\n\n5. 転写\n\n• 概要: 印刷したシートのインク部分を、他の対象物に移し替える加工です。水転写・熱転写・昇華転写の3種類があります。\n• 水転写: ポリマスコットなど立体物が対象です。印刷したシートを水に溶かして浮かせ、剥がして対象物に貼り付けます。\n• 熱転写: 布類など平面のものが対象です。アイロンや大型の熱プレス機で貼り付けます。粘着性のある薄いシートが熱で溶けて付く仕組みです。\n• 昇華転写: ポリエステルを含む繊維が対象です。印刷したシートを貼って熱をかけ、インクを気化させて対象物に浸透させます。\n\n6. 箔押し\n\n• 資料準備中: 箔押しの資料は準備中です。"};let msgs=[],chatOpen=false;

function slideHTML(p,n,total){
 const hon=hdr.on&&!p.nh,ht=p.title||p.subtitle;
 const secs=p.items.map(i=>`<div class="sec">${i.h?`<h3>${esc(i.h)}</h3>`:''}<p>${esc(i.t)}</p></div>`).join('');
 const img=k=>`<div class="ph${p.imgs[k]?' has':''}">${p.imgs[k]?mediaTag(p.imgs[k]):'画像・動画'}</div>`;
 let body;
 if(p.layout==='blocks')body=`<div class="s-body"><div class="s-stack">${p.blocks.map(b=>b.k==='img'?grp(b,`<div class="s-row${b.shape==='square'?' sq':''}${cpos(b)==='below'?' cp':''}" style="--n:${b.n}">${Array.from({length:b.n},(_,k)=>cpos(b)!=='none'?`<div class="s-cell${cpos(b)==='right'?' rt':''}">${phTag(b.imgs[k])}<div class="s-cap2">${esc((b.caps||[])[k]||'')}</div></div>`:phTag(b.imgs[k])).join('')}</div>`):b.k==='text'?`<div class="s-cap">${esc(b.t)}</div>`:blkHTML(b)).join('')}</div></div>`;
 else if(p.layout==='row')body=`<div class="s-body">${grp(p,`<div class="s-row${p.shape==='square'?' sq':''}" style="--n:${p.n}">${Array.from({length:p.n},(_,k)=>img(k)).join('')}</div>`)}</div>`;
 else if(p.layout==='text')body=`<div class="s-body"><div class="s-text wide">${secs}</div></div>`;
 else if(p.layout==='two')body=`<div class="s-body"><div class="s-text">${secs}</div><div class="s-imgs${p.shape==='square'?' sq':''}" style="--n:2">${img(0)}${img(1)}</div></div>`;
 else body=`<div class="s-body ${p.layout}"><div class="s-text">${secs}</div><div class="s-imgs${p.shape==='square'?' sq':''}${p.shape==='square'&&sqn(p)>1?' h':''}${p.shape!=='square'&&p.dir==='h'&&sqn(p)>1?' fh':''}" style="--n:${sqn(p)}">${Array.from({length:sqn(p)},(_,k)=>img(k)).join('')}</div></div>`;
 return `${hon?`<div class="s-banner" style="height:${hdr.h}px"><img src="${hdr.src}" style="object-position:50% ${hdr.y}%;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - ${hdr.f}px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - ${hdr.f}px),transparent)">${hdr.t==='in'&&ht?`<div class="s-bt"><h1 class="s-title">${esc(p.title)}</h1><div class="s-sub">${esc(p.subtitle)}</div></div>`:''}</div>${hdr.t==='in'||!ht?'':`<div class="s-head cmp"><h1 class="s-title">${esc(p.title)}</h1><div class="s-sub">${esc(p.subtitle)}</div></div>`}`:(ht?`<div class="s-head"><h1 class="s-title">${esc(p.title)}</h1><div class="s-sub">${esc(p.subtitle)}</div></div>`:'')}${body}<div class="s-foot" style="background:${ftc};color:${ftx(ftc)}"><span>${esc(p.fl)}</span><span>${esc(p.fr)} ${n}/${total}</span></div>`;
}

 const img=b.k==='tt'?'':shapeSel(b.shape,'setBshape('+i+',this.value)')+((b.k==='tl'||b.k==='il')?niSel(b.ni,'setBni('+i+',this.value)')+(b.shape!=='square'&&sqn(b)>1?dirSel(b.dir,'setBdir('+i+',this.value)'):''):'')+Array.from({length:sqn(b)},(_,k)=>bImgF(i,k,b)).join('')+(b.k==='tw'?bImgF(i,1,b):'')+`<div style="font-size:.75rem;color:#f1c40f;margin:4px 0">推奨: ${b.shape==='square'?Math.min(840,b.k==='tw'?Math.floor((rh-24)/2):rh)+'×'+Math.min(840,b.k==='tw'?Math.floor((rh-24)/2):rh):'840×'+(b.k==='tw'?Math.floor((rh-24)/2):rh)}px</div>`;
 return `<div class="dyn"><button class="x" onclick="delBlock(${i})">削除</button>${ctl}${img}${items}</div>`;

 p.layout='blocks';return true;

function recSize(p,k){
 const tail='。比率が違う場合は中央を自動トリミング。縦横2倍のサイズだと鮮明';
 if(p.shape==='square'){const s=p.layout==='row'?Math.min(bodyH(p),Math.round((1720-24*(p.n-1))/p.n)):p.layout==='two'?Math.min(832,Math.floor((bodyH(p)-24)/2)):Math.min(Math.floor((832-24*(sqn(p)-1))/sqn(p)),bodyH(p));return s+'×'+s+'px(正方形)'+tail}
 if(p.layout==='row')return Math.round((1720-24*(p.n-1))/p.n)+'×'+bodyH(p)+'px'+tail;
 if(p.layout==='two')return '830×'+Math.floor((bodyH(p)-24)/2)+'px'+tail;
 const n=sqn(p);if(n>1&&(p.layout==='l-text'||p.layout==='l-image'))return (p.dir==='h'?Math.floor((832-24*(n-1))/n)+'×'+bodyH(p):'830×'+Math.floor((bodyH(p)-24*(n-1))/n))+'px'+tail;
 return '830×'+bodyH(p)+'px'+tail;
}

const msgsHTML=()=>[{r:'bot',t:chat.greet}].concat(msgs).filter(m=>m.t).map(m=>`<div class="cm ${m.r}">${esc(m.t)}</div>`).join('');

function updateChat(){const t=$('cTitle'),m=$('cMsgs');if(!t||!m)return;t.textContent=chat.title;m.innerHTML=msgsHTML();m.scrollTop=m.scrollHeight}
const norm=s=>String(s).normalize('NFKC').toLowerCase();
function bigrams(s){s=norm(s).replace(/[\s、。，,.!！?？]/g,'');const r=new Set();for(let i=0;i<s.length-1;i++)r.add(s.substr(i,2));return r}
function answer(q){
 const nq=norm(q);let best=null,bs=0;
 chat.faq.forEach(f=>{if(!f.a.trim())return;let sc=0;f.k.split(/[,、，\n]+/).map(x=>norm(x).trim()).filter(Boolean).forEach(k=>{if(nq.includes(k))sc+=k.length+1});if(sc>bs){bs=sc;best=f}});
 if(best)return best.a;
 const kb=kbAsk(q);if(kb)return kb;
 const qb=bigrams(q);let bf=null,bv=0;
 if(qb.size)chat.faq.forEach(f=>{if(!f.a.trim())return;const fb=bigrams(f.k+f.a);let n=0;qb.forEach(b=>{if(fb.has(b))n++});const v=n/qb.size;if(n>=2&&v>bv){bv=v;bf=f}});
 return bf&&bv>=0.4?bf.a:chat.fallback;
}
function kbChunks(){
 const out=[];
 String(chat.kb).split(/\n+/).forEach(par=>{
  const ss=par.match(/[^。！？!?]+[。！？!?]?/g)||[];let cur='';
  ss.forEach(s=>{s=s.trim();if(!s)return;if(cur&&(cur+s).length>150){out.push(cur);cur=''}cur+=s});
  if(cur)out.push(cur);
 });
 return out;
}
function kbSearch(q){
 const qb=new Set();
 q.split(/(ですか|ますか|でしょうか|教えてください|教えて|ください|とは|って何|は何|何ですか|について)/).forEach(p=>bigrams(p).forEach(x=>qb.add(x)));
 if(!qb.size)return '';
 const need=Math.min(2,qb.size);
 const sc=kbChunks().map(c=>{const b=bigrams(c);let n=0;qb.forEach(x=>{if(b.has(x))n++});return{c,n,v:n/qb.size}}).filter(x=>x.n>=need&&x.v>=0.3).sort((a,b)=>b.v-a.v);
 if(!sc.length)return '';
 let r=sc[0].c;if(sc[1]&&sc[1].v>=sc[0].v*0.8)r+='\n'+sc[1].c;
 return r.length>240?r.slice(0,240)+'…':r;
}
function kbParse(){
 const items=[],secs=[];let sec=null;
 const bul=/^[•・●○▪■□*\-]\s*/,hd=/^(?:\d+[.．)）]|[①-⑳]|#+)\s*(.+)$/;
 String(chat.kb).split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
  if(!bul.test(l)){const h=l.match(hd);if(h){sec={t:h[1].trim(),items:[]};secs.push(sec);return}}
  if(bul.test(l)){const body=l.replace(bul,''),m=body.match(/^([^:：]{1,30})[:：]\s*(.+)$/),it=m?{t:m[1].trim(),b:m[2].trim(),s:sec}:{t:'',b:body,s:sec};items.push(it);if(sec)sec.items.push(it);return}
  let cur='';(l.match(/[^。！？!?]+[。！？!?]?/g)||[]).forEach(x=>{x=x.trim();if(!x)return;if(cur&&(cur+x).length>150){items.push({t:'',b:cur,s:sec});cur=''}cur+=x});if(cur)items.push({t:'',b:cur,s:sec});
 });
 return {items,secs};
}
function kbAsk(q){
 const {items,secs}=kbParse();
 if(!items.length)return '';
 q=q.replace(/欠点|弱点|短所|難点/g,'デメリット').replace(/利点|長所|強み/g,'メリット').replace(/特徴/g,'特長');
 const qb=new Set();
 q.split(/(ですか|ますか|でしょうか|教えてください|教えて|ください|とは|って何|は何|何ですか|について|に関して|ありますか)/).forEach(p=>bigrams(p).forEach(x=>qb.add(x)));
 if(!qb.size)return '';
 const docs=items.map(it=>({it,tb:bigrams(it.t),bb:bigrams(it.b),sb:bigrams(it.s?it.s.t:'')})).concat(secs.map(s=>({sec:s,tb:bigrams(s.t),bb:new Set()})));
 const df=new Map();
 docs.forEach(d=>new Set([...d.tb,...d.bb]).forEach(x=>df.set(x,(df.get(x)||0)+1)));
 const N=docs.length,idf=x=>Math.log((N+1)/((df.get(x)||0)+0.5));
 let tot=0;qb.forEach(x=>{if(df.has(x))tot+=idf(x)});
 if(tot<=0)return '';
 const need=Math.min(2,qb.size);
 const sc=docs.map(d=>{let v=0,n=0;qb.forEach(x=>{if(!df.has(x))return;const w=d.tb.has(x)?2:d.bb.has(x)?1:(d.sb&&d.sb.has(x))?1:0;if(w){n++;v+=idf(x)*w}});let r=n>=need?v/(2*tot)*(d.sec?0.9:1):0;if(r>0&&d.it&&d.it.t&&norm(d.it.t).length>=2&&norm(q).includes(norm(d.it.t))){r+=0.35;if(d.it.s&&norm(q).includes(norm(d.it.s.t.split('・')[0])))r+=0.15}return {d,v:r}}).sort((a,b)=>b.v-a.v);
 const top=sc[0];
 if(!top||top.v<0.22)return '';
 let r;
 if(top.d.sec){r='【'+top.d.sec.t+'】\n'+top.d.sec.items.map(i=>'・'+(i.t||i.b.slice(0,40))).join('\n')}
 else{
  const f=x=>x.d.it.t?'【'+x.d.it.t+'】'+x.d.it.b:x.d.it.b;
  r=f(top);
  const nx=sc.find(x=>x!==top&&x.d.it&&x.v>=top.v*0.9);
  if(nx)r+='\n\n'+f(nx);
 }
 return r.length>320?r.slice(0,320)+'…':r;
}

function setChat(c,add){
 if(!c||typeof c!=='object')return;const s=v=>typeof v==='string'?v:'';
 const faq=Array.isArray(c.faq)?c.faq.filter(f=>f&&typeof f==='object').map(f=>({k:s(f.k),a:s(f.a)})):[];
 if(add){chat.faq=chat.faq.filter(f=>f.k||f.a).concat(faq);chat.kb=(chat.kb+'\n'+s(c.kb)).trim();return}
 chat.title=s(c.title)||chat.title;chat.greet=s(c.greet);chat.fallback=s(c.fallback)||chat.fallback;chat.faq=faq.length?faq:[{k:'',a:''}];chat.kb=s(c.kb);
}

const note=t=>{$('msg').textContent=t};
const IMG_OK=/^(data:(image\/(png|jpe?g|gif|webp|svg\+xml)|video\/(mp4|webm|quicktime));base64,[A-Za-z0-9+\/=]+|yt:[A-Za-z0-9_-]{11})$/;
function normPage(o){
 const p=newPage(),s=v=>typeof v==='string'?v:'';
 if(!o||typeof o!=='object')return p;
 p.layout=LAYOUTS[o.layout]?o.layout:'l-text';
 p.shape=o.shape==='square'?'square':'fit';
 const cc=v=>/^#[0-9a-fA-F]{6}$/.test(v||''),tn=parseInt(o.ts);
 p.ts=o.ts==='auto'||!(tn>=14&&tn<=48)?'auto':tn;p.tc=cc(o.tc)?o.tc:p.tc;p.hc=cc(o.hc)?o.hc:p.hc;p.tb=!!o.tb;p.nh=!!o.nh;p.tp=['below','right'].includes(o.tp)?o.tp:'none';p.ni=Math.min(4,Math.max(1,parseInt(o.ni)||1));p.dir=o.dir==='h'?'h':'v';p.chat=!!o.chat;p.title=s(o.title);p.subtitle=s(o.subtitle);p.fl=s(o.fl);p.fr=s(o.fr);
 p.blocks=Array.isArray(o.blocks)?o.blocks.filter(b=>b&&typeof b==='object').slice(0,12).map(b=>b.k==='img'?{k:'img',n:Math.min(5,Math.max(2,parseInt(b.n)||3)),imgs:[0,1,2,3,4].map(i=>Array.isArray(b.imgs)&&IMG_OK.test(s(b.imgs[i]))?b.imgs[i]:''),t:'',shape:b.shape==='square'?'square':'fit',cpos:['below','right'].includes(b.cpos)?b.cpos:(b.cap?'below':'none'),cap:!!b.cap||b.cpos==='below',caps:[0,1,2,3,4].map(i=>s(Array.isArray(b.caps)?b.caps[i]:'')),tp:['below','right'].includes(b.tp)?b.tp:'none',items:Array.isArray(b.items)?b.items.filter(x=>x&&typeof x==='object').slice(0,12).map(x=>({h:s(x.h),t:s(x.t)})):[]}:b.k==='tl'||b.k==='il'||b.k==='tw'||b.k==='tt'?{k:b.k,n:3,imgs:[0,1,2,3,4].map(i=>Array.isArray(b.imgs)&&IMG_OK.test(s(b.imgs[i]))?b.imgs[i]:''),t:'',shape:b.shape==='square'?'square':'fit',ni:Math.min(4,Math.max(1,parseInt(b.ni)||1)),dir:b.dir==='h'?'h':'v',cap:false,caps:['','','','',''],items:Array.isArray(b.items)?b.items.filter(x=>x&&typeof x==='object').slice(0,12).map(x=>({h:s(x.h),t:s(x.t)})):[]}:{k:'text',n:3,imgs:['','','','',''],t:s(b.t)}):[];
 p.n=Math.min(5,Math.max(2,parseInt(o.n)||3));p.imgs=[0,1,2,3,4].map(k=>Array.isArray(o.imgs)&&IMG_OK.test(s(o.imgs[k]))?o.imgs[k]:'');
 p.items=Array.isArray(o.items)?o.items.filter(i=>i&&typeof i==='object').map(i=>({h:s(i.h),t:s(i.t)})):[];
 return p;
}
async function saveJSON(){
 const name='slides_'+new Date().toISOString().slice(0,10)+'.json';
 const data=JSON.stringify({format:'fhd-slides',version:3,pages,chat,ftc,hdr:{on:hdr.on,h:hdr.h,t:hdr.t,y:hdr.y,f:hdr.f,src:hdr.src===HDR_DEFAULT?'':hdr.src}},null,1);
 try{
  const d=window.claude?await claude.use('downloads'):null;
  if(d){await d.save({filename:name,data});note('保存しました')}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();note('保存しました')}
 }catch(e){if(!e||e.code!=='declined')note('保存できませんでした'+(e&&e.code?': '+e.code:''))}
}
let jsonMode='replace';

$('jsonIn').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j&&j.pages;
   if(!Array.isArray(arr)||!arr.length)throw 0;
   const imp=arr.map(normPage);
   if(jsonMode==='replace'){
    if(!confirm('現在の内容を破棄して読み込みますか？'))return;
    pages=imp;cur=0;setChat(j.chat,false);setHdrJ(j.hdr);if(/^#[0-9a-fA-F]{6}$/.test(j.ftc||''))ftc=j.ftc;
   }else{cur=pages.length;pages=pages.concat(imp);setChat(j.chat,true)}
   renderForm();renderSlide();updateChat();note(imp.length+'ページ読み込みました');
  }catch(err){note('読み込めませんでした。このシステムで保存したJSONを選んでください')}
 };
 r.readAsText(f);
});
